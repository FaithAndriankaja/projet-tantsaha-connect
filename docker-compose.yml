version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the schema.sql so it runs automatically on first init
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      - POSTGRES_USER=tantsaha_user
      - POSTGRES_PASSWORD=tantsaha_password
      - POSTGRES_DB=tantsaha_db
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=django-insecure-tantsaha-connect-dev-key
      - DATABASE_URL=postgres://tantsaha_user:tantsaha_password@db:5432/tantsaha_db
    depends_on:
      - db

volumes:
  postgres_data:
